name: Release

# Publishes to npm through **trusted publishing**, with provenance attached.
#
# There is no publish token. npm exchanges the workflow's OIDC identity for a
# short-lived credential, which is why `id-token: write` is required below and
# why no `NPM_TOKEN` secret appears anywhere in this file. Nothing long-lived
# exists to leak, and the publish satisfies npm's 2FA requirement — a stored
# token no longer does, since npm began restricting tokens that bypass 2FA.
#
# Configured on npmjs.com under the package's Trusted Publisher settings, naming
# this repository and this workflow file. If that entry is missing or names a
# different workflow, `npm publish` fails with a 404 or an authentication error
# rather than anything that mentions OIDC — check there first.
#
# Requires npm 11.5.1 or later, which the pinned `npm@latest` step below
# guarantees regardless of what the runner image ships.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write        # the credential itself: provenance and trusted publishing both need it

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release # gate releases on a required reviewer
    steps:
      - uses: actions/checkout@v4

      # No `registry-url:` on purpose. With it, setup-node writes an .npmrc
      # containing `_authToken=${NODE_AUTH_TOKEN}` and exports that variable as
      # the literal placeholder `XXXXX-XXXXX-XXXXX-XXXXX`. npm then finds a
      # credential, uses it instead of performing the OIDC exchange, and the
      # publish fails with `404 on PUT` — which names the package rather than the
      # cause. Without it npm has no credential, so trusted publishing engages.
      # The default registry is registry.npmjs.org and no package overrides it.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later; provenance needs 9.5.0.
      # Pinning to latest keeps this from silently depending on the runner image.
      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@latest

      # Trusted publishing has three preconditions, and when one is missing npm
      # says only `ENEEDAUTH` — the same thing it says for a plain missing token.
      # This reports each one so a failure names its own cause. No secret is
      # printed: the OIDC variables are reported as present or absent only.
      - name: Check the preconditions for trusted publishing
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm:      $NPM_VERSION"
          echo "registry: $(npm config get registry)"

          node -e '
            const [maj, min, patch] = process.argv[1].split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && patch >= 1)));
            console.log("npm >= 11.5.1: " + (ok ? "yes" : "NO — trusted publishing is unsupported"));
            if (!ok) process.exitCode = 1;
          ' "$NPM_VERSION"

          # Set by the runner only when the job has `id-token: write`. Without
          # them npm cannot request an OIDC token and falls back to ENEEDAUTH.
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "OIDC request variables: present"
          else
            echo "::error::OIDC request variables are absent, so npm cannot authenticate. The job needs 'id-token: write', and the repository or organisation must not restrict it."
            exit 1
          fi

          # Any credential here takes precedence over OIDC and produces a 404 on
          # PUT instead of an exchange.
          for f in .npmrc "$NPM_CONFIG_USERCONFIG" "$HOME/.npmrc"; do
            if [ -n "$f" ] && [ -f "$f" ]; then
              echo "::warning::An npmrc exists at $f — if it carries a token, it will be used instead of OIDC."
              grep -c "_authToken" "$f" | sed 's/^/  _authToken lines: /'
            fi
          done

      - run: npm ci

      - name: Verify before publishing
        run: npm run lint && npm run typecheck && npm run test:coverage

      - name: Confirm the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "v$VERSION" = "${GITHUB_REF_NAME}" \
            || { echo "Tag ${GITHUB_REF_NAME} does not match package version $VERSION" >&2; exit 1; }

      # A file: or link: dependency is meaningless on a user's machine and
      # produces a broken install. npm publish will not warn about it.
      - name: Refuse unpublishable dependencies
        run: |
          node -e "
            const deps = { ...require('./package.json').dependencies };
            const bad = Object.entries(deps).filter(([, v]) => /^(file|link):/.test(v));
            if (bad.length) {
              console.error('Unpublishable dependencies: ' + JSON.stringify(bad));
              process.exit(1);
            }
          "

      # `npm publish` creates a package that does not exist yet — there is no
      # separate creation step. What it cannot create is the **scope**: an npm
      # organisation, or a user account whose name matches it. Publishing into a
      # scope you do not own returns `404 on PUT`, because npm will not reveal
      # whether it exists, and that error names the package rather than the
      # cause. This step says the cause out loud.
      #
      # There is no identity to check before publishing: trusted publishing has
      # no credential until `npm publish` performs the OIDC exchange, so
      # `npm whoami` reports nobody. The checks below use `npm view`, which needs
      # no authentication for a public package.
      - name: Inspect the registry
        id: registry
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if npm view "$NAME" version >/dev/null 2>&1; then
            echo "first=false" >> "$GITHUB_OUTPUT"

            # npm versions are immutable. Republishing one is refused, and it is
            # clearer to say so here than to read EPUBLISHCONFLICT out of npm.
            if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null)" ]; then
              echo "::error::$NAME@$VERSION is already published. Versions are immutable — bump the version and tag again."
              exit 1
            fi

            echo "::notice::Publishing $VERSION of the existing package $NAME."
          else
            echo "first=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME is not on the registry. This publish will create it."
          fi

      # `--access public` is what creates a *scoped* package as public. Without
      # it npm makes the first publish private, which fails on a free account
      # and is not what an open-source package wants either way.
      #
      # The scope itself must already exist: npm cannot create the @govplane
      # organisation on your behalf, and a missing one fails here with a 404.
      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      # No `env:` block. npm exchanges this job's OIDC identity for a short-lived
      # credential at publish time; supplying a token here would take precedence
      # and put the release back on the path npm is restricting.
      - name: Publish
        run: npm publish --access public --provenance

      - name: Summarise
        if: success()
        run: |
          {
            echo "### Published ${{ steps.registry.outputs.name }}@${{ steps.registry.outputs.version }}"
            echo
            if [ "${{ steps.registry.outputs.first }}" = "true" ]; then
              echo "Created the package on npm for the first time."
              echo
              echo "**Next:** confirm the Trusted Publisher entry on npmjs.com still names"
              echo "this repository and \`release.yml\`, so later releases keep publishing"
              echo "without a token."
            else
              echo "Published a new version of an existing package."
            fi
            echo
            echo "https://www.npmjs.com/package/${{ steps.registry.outputs.name }}"
          } >> "$GITHUB_STEP_SUMMARY"
