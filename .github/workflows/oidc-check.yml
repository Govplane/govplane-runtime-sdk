name: OIDC check

# A throwaway diagnostic. Run it from the Actions tab, read the summary, delete
# the file. It publishes nothing and needs no secrets.
#
# It answers one question: does this repository actually receive an OIDC token?
# `npm publish` cannot say — when trusted publishing is unavailable for any
# reason it reports `ENEEDAUTH`, the same message it gives for a missing token,
# so the cause has to be established separately.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@latest

      - name: Report the preconditions
        run: |
          NPM_VERSION=$(npm --version)

          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            OIDC="present"
          else
            OIDC="ABSENT"
          fi

          VERSION_OK=$(node -e '
            const [maj, min, patch] = process.argv[1].split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && patch >= 1)));
            console.log(ok ? "yes" : "NO");
          ' "$NPM_VERSION")

          {
            echo "| Precondition | Value |"
            echo "| --- | --- |"
            echo "| npm version | $NPM_VERSION |"
            echo "| npm >= 11.5.1 | $VERSION_OK |"
            echo "| OIDC request variables | $OIDC |"
            echo "| registry | $(npm config get registry) |"
            echo
            if [ "$OIDC" = "ABSENT" ]; then
              echo "**The runner is not issuing an OIDC token.** \`id-token: write\` is"
              echo "declared in this workflow, so the grant is being refused above the"
              echo "repository — an organisation policy on Actions permissions, or the"
              echo "repository being excluded from it. Until that is lifted, trusted"
              echo "publishing cannot work and publishing needs a token."
            else
              echo "**The runner is issuing an OIDC token.** GitHub's side is fine, so a"
              echo "failing publish is on the npm side: the package's Trusted Publisher"
              echo "entry must name this repository and the workflow file exactly"
              echo "(\`release.yml\`, not a path)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          cat "$GITHUB_STEP_SUMMARY"
